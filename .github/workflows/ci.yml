name: Validate evidence and decision pipeline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - run: python -m pip install -r requirements-validation.txt
      - run: python scripts/independent-oracle.py
      - run: python scripts/independent-imerg-oracle.py
      - run: python scripts/independent-combined-oracle.py
      - run: npm run check
